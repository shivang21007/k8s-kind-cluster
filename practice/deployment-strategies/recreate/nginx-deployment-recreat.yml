apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-deploy
  name: nginx-deploy
  namespace: shivang
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-deploy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nginx-deploy
    spec:
      containers:
      - image: mynginx:v1
        name: my-nginx
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
          - name: IMAGE_TAG
            value: "v1"
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        resources:
          requests:
            cpu: "5m"
            memory: "128Mi"
          limits:
            cpu: "10m"
            memory: "256Mi"
status: {}
