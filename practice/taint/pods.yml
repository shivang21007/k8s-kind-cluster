apiVersion: v1
kind: Pod
metadata:
  labels:
    run: redis
  name: redis
spec:
  containers:
  - image: redis
    name: redis
    resources: {}
  dnsPolicy: ClusterFirst
  tolerations:
    - key: "gpu"
      operator: "Equal"
      value: "true"
      effect: NoSchedule
  restartPolicy: Always
status: {}
