kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v1

metadata:
  name: mysql-hpa
  namespace: mysql-ns

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mysql-deploy
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
  