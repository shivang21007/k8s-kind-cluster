kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2

metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # this applies on deployments.spec.template.spec.containers.resources.requests.cpu i.e. 100m and 70% of 100m is 70m . so when cpu usage is 70m then it will scale up.
