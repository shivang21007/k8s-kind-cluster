apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  strategy: {}
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - image: nginx
        name: nginx
        resources:
          requests:
            cpu: 100m # used for hpa scaling
            memory: 128Mi
          limits:
            cpu: 200m # max cpu allowed by kernel , if exceeded then pod will be killed
            memory: 256Mi
status:
