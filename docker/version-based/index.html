<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>K8s Pod Identity</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 350px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 24px;
      color: #38bdf8;
    }

    .info {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #0f172a;
      font-size: 14px;
    }

    .label {
      color: #94a3b8;
    }

    .value {
      font-weight: bold;
      color: #22c55e;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🚀 K8s Pod Viewer</h1>
    <p>You're hitting a live pod inside Kubernetes</p>

    <div class="info">
      <p><span class="label">Pod Name:</span> <span class="value" id="podName">Loading...</span></p>
      <p><span class="label">Version:</span> <span class="value" id="version">Loading...</span></p>
      <p><span class="label">Timestamp:</span> <span class="value" id="time"></span></p>
    </div>

    <div class="footer">
      Refresh to see load balancing across pods
    </div>
  </div>

  <script>
    // Simulated values (replace in real setup)
    const VERSION = window.VERSION || "v1.0.0"; 

    function updateUI() {
      // Pod name (hostname from browser perspective)
      document.getElementById("podName").innerText = "__POD_NAME__";

      // Version
      document.getElementById("version").innerText = " __VERSION__";

      // Current time
      document.getElementById("time").innerText = "__TIME__";
    }

    updateUI();
  </script>
</body>
</html>
