apiVersion: apps/v1
kind: Deployment

metadata:
  name: bankapp-mysql-deployment
  namespace: bankapp

spec:
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: RollingUpdate # there are two types of strategy: RollingUpdate and Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bankapp-secret 
                  key: MYSQL_ROOT_PASSWORD
            
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: bankapp-config
                  key: MYSQL_DATABASE
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 10
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
      
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: bankapp-mysql-pvc
        
            